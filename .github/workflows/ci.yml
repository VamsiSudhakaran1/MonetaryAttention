name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  android:
    name: Android (assembleDebug + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Unit tests (estimate engine)
        run: ./gradlew :app:testPlayDebugUnitTest --no-daemon
      - name: Assemble debug APKs (both flavors)
        run: ./gradlew :app:assemblePlayDebug :app:assembleFullDebug --no-daemon
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: attention-mirror-debug
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
